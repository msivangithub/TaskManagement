buildscript {
    repositories {
        maven { url 'https://maven.fabric.io/public' }
    }

    dependencies {
        classpath 'io.fabric.tools:gradle:1.+'
    }
}
apply plugin: 'com.android.application'
apply plugin: 'io.fabric'

repositories {
    maven { url 'https://maven.fabric.io/public' }
}


android {
    compileSdkVersion 28
    buildToolsVersion "28.0.3"


    defaultConfig {
        applicationId "com.office.taskmanager"
        minSdkVersion 15
        targetSdkVersion 28
        versionCode 2
        versionName "1.1"
        multiDexEnabled true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.12'
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support:design:28.0.0'
    implementation 'de.hdodenhof:circleimageview:2.0.0'
    implementation 'com.android.support:recyclerview-v7:28.0.0'
    implementation 'com.android.support:cardview-v7:28.0.0'
    implementation 'com.adeel:easyFTP:1.0'
    implementation 'org.jbundle.util.osgi.wrapped:org.jbundle.util.osgi.wrapped.org.apache.http.client:4.1.2'
    implementation 'jp.wasabeef:recyclerview-animators:2.2.3'
    implementation 'com.squareup.picasso:picasso:2.4.0'
    implementation 'junit:junit:4.12'
    implementation 'com.android.support:support-v4:28.0.0'
   // compile 'com.google.firebase:firebase-messaging:10.0.1'
    //compile 'com.google.firebase:firebase-messaging:9.0.0'
    implementation 'com.github.clans:fab:1.6.2'
    implementation 'com.facebook.fresco:fresco:0.9.0'
    implementation 'com.simplecityapps:recyclerview-fastscroll:1.0.5'
    implementation 'com.futuremind.recyclerfastscroll:fastscroll:0.2.4'
    implementation 'com.amulyakhare:com.amulyakhare.textdrawable:1.0.1'
    implementation 'com.soundcloud.android:android-crop:1.0.1@aar'
    implementation 'xyz.danoz:recyclerviewfastscroller:0.1.3'
    implementation 'com.jakewharton:butterknife:8.4.0'
    implementation 'com.github.bumptech.glide:glide:3.7.0'
    implementation 'com.toptoche.searchablespinner:searchablespinnerlibrary:1.3.1'
    implementation ('com.facebook.android:audience-network-sdk:4.28.0',{
        exclude group: 'com.google.android.gms'
    })
    implementation('ch.acra:acra:4.5.0') {
        exclude group: 'org.json'
    }
    implementation files('libs/activation.jar')
    implementation files('libs/additionnal.jar')
    implementation files('libs/mail.jar')

    androidTestImplementation 'com.jayway.android.robotium:robotium-solo:5.5.4'

    implementation project(path: ':library')
  /*  compile('com.crashlytics.sdk.android:crashlytics:2.6.5@aar') {
        transitive = true;
    }*/

}

